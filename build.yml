name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build with Gradle
      run: |
        if [ -f ./gradlew ]; then
          chmod +x ./gradlew
          ./gradlew assembleDebug
        else
          echo "Gradle wrapper not found"
        fi
